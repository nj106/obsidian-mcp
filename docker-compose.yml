services:
  obsidian-mcp:
    image: ghcr.io/nj106/obsidian-mcp:latest
    container_name: obsidian-mcp
    network_mode: bridge
    restart: unless-stopped
    environment:
      MCP_TOKEN: ${MCP_TOKEN}
    ports:
      # Single door: loopback only, for the Caddy public HTTPS entry
      # (the gateway enforces the bearer token). No Tailscale-IP
      # binding: this door is not exposed over Tailscale (2026-11-08).
      - "127.0.0.1:8096:8080"
    volumes:
      - livesync_vault:/vault
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  livesync_vault:
    external: true
    name: livesync_vault
