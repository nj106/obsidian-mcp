services:
  obsidian-mcp:
    image: ghcr.io/nj106/obsidian-mcp:latest
    container_name: obsidian-mcp
    network_mode: bridge
    restart: unless-stopped
    environment:
      MCP_TOKEN: ${MCP_TOKEN}
    ports:
      # Two doors onto the same gateway (which enforces the bearer
      # token): the server's Tailscale IP for tailnet agents, and
      # loopback for the Caddy public HTTPS entry.
      - "100.85.84.67:8096:8080"
      - "127.0.0.1:8096:8080"
    volumes:
      - livesync_vault:/vault
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  livesync_vault:
    external: true
    name: livesync_vault
